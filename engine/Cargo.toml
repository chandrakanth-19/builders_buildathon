[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow = { version = "60.1.0", default-features = false }
libc = "0.2"
memchr = "2.7"
memmap2 = "0.9.12"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false
debug = 1
